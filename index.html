<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>尋寶之家：字母大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#263047; --paper:#fffaf0; --gold:#f6c343; --gold-d:#c9971c; --sky:#6ec6ff; --pink:#ff8fb1; --mint:#3fbf96; --red:#ef4f5f;
  --bg:#e9f5ff; --hud:rgba(255,250,240,.93); --muted:#6f7890;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#141a26; --hud:rgba(33,40,58,.92); --paper:#212a3d; --ink:#eef3ff; --muted:#a9b3c9; } }
:root[data-theme="dark"]{ --bg:#141a26; --hud:rgba(33,40,58,.92); --paper:#212a3d; --ink:#eef3ff; --muted:#a9b3c9; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.en{font-family:"Fredoka","Noto Sans TC",sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hud{position:absolute;pointer-events:none}
#stat{top:10px;left:10px;display:flex;gap:10px;align-items:stretch}
.pill{background:var(--hud);border-radius:14px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.pill small{font-size:11px;color:var(--muted);font-weight:700}
.pill b{font-size:22px;font-family:"Fredoka",sans-serif}
#timer.low b{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
#quiz{top:70px;left:10px;background:var(--hud);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-height:calc(100% - 200px);overflow:auto;pointer-events:auto;max-width:min(360px,62vw)}
#quiz h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px}
#quiz h3 .en{font-size:13px;color:var(--muted)}
.w{display:grid;grid-template-columns:3.4em auto;align-items:center;gap:6px;margin:4px 0;padding:2px 4px;border-radius:8px;transition:background .3s}
.w .zh{font-size:13px;font-weight:700;color:var(--muted);text-align:right}
.w.done{background:rgba(63,191,150,.18)}
.w.done .zh{color:var(--mint)}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.slots i{font-style:normal;width:24px;height:28px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;border-radius:4px 4px 0 0;background:rgba(0,0,0,.04)}
.slots i.on{background:var(--gold);border-bottom-color:var(--gold-d);color:#263047}
.w.done .slots i.on{background:var(--mint);border-bottom-color:#2a8d6d;color:#fff}
.slots i.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.45)}}
#right{top:10px;right:10px;display:flex;gap:6px;pointer-events:auto}
#right button{background:var(--hud);color:var(--ink);border:0;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#cross{left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px rgba(0,0,0,.45);transition:all .12s}
#cross.hot{width:38px;height:38px;margin:-19px 0 0 -19px;background:transparent;border:3px solid var(--gold);box-shadow:0 0 0 1.5px rgba(0,0,0,.4)}
#prompt{left:50%;top:calc(50% + 34px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:10px;font-size:15px;font-weight:700;white-space:nowrap;display:none}
#prompt b{font-family:"Fredoka",sans-serif;color:var(--gold);font-size:20px;margin:0 4px}
#room{top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:5px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .4s}
#room.show{opacity:1}
#angelMini{left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;opacity:0;transform:translateY(12px);transition:all .35s;max-width:min(440px,80vw)}
#angelMini.show{opacity:1;transform:none}
#angelMini svg{width:64px;height:74px;flex:none}
.bubble{background:var(--paper);color:var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);margin-bottom:26px}
.fly{position:fixed;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:10px;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:28px;color:#fff;z-index:40;pointer-events:none;transition:transform .75s cubic-bezier(.45,-0.25,.35,1.15),opacity .35s;box-shadow:0 6px 18px rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.8)}
.fly.poof{opacity:0;transform:var(--end) scale(1.8) rotate(25deg)!important}
.beamtip{left:50%;bottom:24%;transform:translateX(-50%)}
#joy{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.7);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9)}
#grab{position:absolute;right:24px;bottom:calc(36px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;border:0;background:var(--gold);color:#263047;font-weight:900;font-size:18px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#grab:disabled{opacity:.4}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(20,28,48,.5);backdrop-filter:blur(3px);z-index:30}
.overlay.hidden{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:26px;max-width:560px;width:100%;max-height:94%;overflow-y:auto;padding:26px 24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35);position:relative}
.card h1{margin:0;font-size:38px;font-weight:900;line-height:1.15}
.card h1 span{display:block;font-family:"Fredoka",sans-serif;font-size:22px;color:var(--gold-d)}
.card h2{margin:0 0 4px;font-size:26px;font-weight:900}
.card p{line-height:1.7;margin:10px 0}
.host{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.host svg{width:120px;height:140px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){ .host svg{animation:none} .fly{transition-duration:.01s} }
.speech{background:var(--bg);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px;line-height:1.7;font-weight:500;min-height:90px}
.speech b{color:var(--gold-d)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0;color:var(--muted)}
.keys kbd{font-family:"Fredoka",sans-serif;background:var(--bg);border-radius:6px;padding:2px 8px;color:var(--ink);font-weight:500;justify-self:start}
.go{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--ink);color:var(--paper);font-size:19px;font-weight:900;letter-spacing:.15em;text-indent:.15em}
.go.gold{background:var(--gold);color:#263047}
.row2{display:flex;gap:8px}
.row2 .go{flex:1}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.answers{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.answers span{background:var(--bg);border-radius:8px;padding:4px 10px;font-weight:700}
.answers span.ok{background:rgba(63,191,150,.2)}
.answers span .en{font-size:17px;margin-right:4px}
.big{font-family:"Fredoka",sans-serif;font-size:48px;font-weight:700;line-height:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:14px 0}
.stats3 div{background:var(--bg);border-radius:14px;padding:10px 6px;font-size:12px;color:var(--muted);font-weight:700}
.stats3 b{display:block;font-family:"Fredoka",sans-serif;font-size:26px;color:var(--ink)}
.scenes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.scenes span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);font-weight:700}

@media (max-width:640px){
  #quiz{top:62px;padding:8px;max-height:44%}
  .slots i{width:17px;height:21px;font-size:13px;border-bottom-width:2px}
  .w{grid-template-columns:2.8em auto;gap:4px;margin:2px 0}
  .w .zh{font-size:11px}
  .pill b{font-size:18px}
  .card h1{font-size:30px}
  .host{grid-template-columns:84px 1fr}
  .host svg{width:84px;height:98px}
  #angelMini{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div class="hud" id="stat">
    <div class="pill"><small id="lvName">第 1 關</small><b id="scName" style="font-family:'Noto Sans TC';font-size:16px">家裡</b></div>
    <div class="pill" id="timer"><small>剩餘時間</small><b id="time">0:00</b></div>
    <div class="pill"><small>分數</small><b id="score">0</b></div>
  </div>
  <div class="hud" id="quiz" aria-live="polite"></div>
  <div class="hud" id="room"></div>
  <div class="hud" id="right"><button id="hintBtn">✨ 提示 −15秒</button><button id="pauseBtn">暫停</button></div>
  <div class="hud" id="cross"></div>
  <div class="hud" id="prompt"></div>
  <div class="hud" id="angelMini"><svg viewBox="0 0 120 140" class="angel"></svg><div class="bubble" id="angelSay"></div></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="grab" disabled>撿起</button>

  <div class="overlay" id="titleOv"><div class="card">
    <div class="host"><svg viewBox="0 0 120 140" class="angel"></svg>
      <div><h1>尋寶之家<span>Letter Quest!</span></h1><p style="margin:6px 0 0;color:var(--muted)">跟著天使主持人，找出字母拼出單字</p></div></div>
    <p>每一關天使會出一個主題，例如「食物」，並給你 5～10 個單字的空格。場景裡散落著許多字母方塊，撿起來的字母會飛進空格；用不到的字母會自動消失。在時間內把所有單字拼完就過關！</p>
    <div class="scenes"><span>🏠 家裡</span><span>🏭 廠房</span><span>🌳 公園</span><span>🏀 籃球場</span><span>🏫 學校教室</span></div>
    <div class="keys" id="keys"></div>
    <p id="bestTxt" style="color:var(--muted);font-size:14px;margin:0"></p>
    <button class="go gold" id="startBtn">開始冒險</button>
  </div></div>

  <div class="overlay hidden" id="introOv"><div class="card">
    <div class="host"><svg viewBox="0 0 120 140" class="angel"></svg><div class="speech" id="introSpeech"></div></div>
    <div class="tags" id="introTags"></div>
    <button class="go gold" id="goBtn">出發！</button>
  </div></div>

  <div class="overlay hidden" id="pauseOv"><div class="card">
    <h2>暫停中</h2><p style="color:var(--muted);margin:0">時間已經停止，準備好再繼續。</p>
    <div class="answers" id="pauseList"></div>
    <div class="row2"><button class="go ghost" id="quitBtn">回到標題</button><button class="go" id="resumeBtn">繼續</button></div>
  </div></div>

  <div class="overlay hidden" id="clearOv"><div class="card">
    <div class="host"><svg viewBox="0 0 120 140" class="angel"></svg><div class="speech" id="clearSpeech"></div></div>
    <div class="stats3" id="clearStats"></div>
    <div class="answers" id="clearWords"></div>
    <button class="go gold" id="nextBtn">下一關</button>
  </div></div>

  <div class="overlay hidden" id="failOv"><div class="card">
    <div class="host"><svg viewBox="0 0 120 140" class="angel"></svg><div class="speech" id="failSpeech"></div></div>
    <p style="margin:12px 0 0;font-weight:700">這一關的答案：</p>
    <div class="answers" id="failWords"></div>
    <div class="row2"><button class="go ghost" id="toTitle">回到標題</button><button class="go gold" id="retryBtn">再挑戰一次</button></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#c');
const isTouch = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = t => { t=Math.max(0,Math.ceil(t)); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };

let angelT=0;
function angelSay(msg, ms=2800){ $('#angelSay').innerHTML=msg; const a=$('#angelMini'); a.classList.add('show'); clearTimeout(angelT); angelT=setTimeout(()=>a.classList.remove('show'), ms); }
function typeInto(el, html){
  el.innerHTML=''; const tmp=document.createElement('div'); tmp.innerHTML=html; const full=tmp.innerHTML; let i=0;
  clearInterval(el._t);
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ el.innerHTML=full; return; }
  el._t = setInterval(()=>{ // skip over tags
    if (full[i]==='<'){ i = full.indexOf('>',i)+1; } else i++;
    el.innerHTML = full.slice(0,i) + '<span style="opacity:.3">▍</span>';
    if (i>=full.length){ clearInterval(el._t); el.innerHTML=full; }
  }, 28);
  el.onclick = ()=>{ clearInterval(el._t); el.innerHTML=full; };
}

const LETTER_COLORS = ['#ef4f5f','#3a8fe0','#3fbf96','#f39c12','#9b59b6','#e84393','#16a085','#d35400'];
const letterMats = {};
function letterMat(ch, col){
  const k=ch+col; if (letterMats[k]) return letterMats[k];
  const tex = texCanvas(128,128,g=>{ g.fillStyle=col; g.fillRect(0,0,128,128); g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=8; g.strokeRect(8,8,112,112);
    g.fillStyle='#fff'; g.font='700 86px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(ch,64,70); });
  return letterMats[k] = new THREE.MeshLambertMaterial({map:tex});
}
const cubeGeo = new THREE.BoxGeometry(0.28,0.28,0.28);
const hitGeo = new THREE.SphereGeometry(0.3,10,8);
const hitMat = new THREE.MeshBasicMaterial({visible:false});
let letters = [];
function collidesAt(x,z,r){
  for (const [a,b,c,d] of colliders){ const cx=Math.max(a,Math.min(x,c)), cz=Math.max(b,Math.min(z,d)); if ((x-cx)**2+(z-cz)**2 < r*r) return true; }
  for (const [cx,cz,cr] of circles){ if ((x-cx)**2+(z-cz)**2 < (cr+r)**2) return true; }
  return false;
}
function spawnLetters(chars, start){
  for (const l of letters){ scene.remove(l.mesh); scene.remove(l.hit); } letters=[];
  const total = surfaces.reduce((s,a)=>s+a.w,0);
  const placed = [];
  for (const ch of chars){
    let pos=null;
    for (let tries=0; tries<80 && !pos; tries++){
      let r=Math.random()*total, sf=surfaces[0]; for (const s of surfaces){ r-=s.w; if (r<=0){ sf=s; break; } }
      const x=rand(sf.x1,sf.x2), z=rand(sf.z1,sf.z2);
      if (sf.y<0.05 && collidesAt(x,z,0.35)) continue;
      if (Math.hypot(x-start.x,z-start.z)<1.5) continue;
      if (placed.some(p=>Math.abs(p.y-sf.y)<0.5 && Math.hypot(p.x-x,p.z-z)<0.55)) continue;
      pos={x,y:sf.y,z};
    }
    if (!pos) continue;
    placed.push(pos);
    const mesh = new THREE.Mesh(cubeGeo, letterMat(ch, pick(LETTER_COLORS)));
    mesh.position.set(pos.x, pos.y+0.16, pos.z); mesh.rotation.y=Math.random()*6;
    const hit = new THREE.Mesh(hitGeo, hitMat); hit.position.copy(mesh.position);
    scene.add(mesh); scene.add(hit);
    const L = {ch, mesh, hit, base:pos.y+0.16, ph:Math.random()*6, alive:true};
    hit.userData.L = L; letters.push(L);
  }
}

function setupLevel(retry){
  sceneIdx = (level-1)%SCENES.length;
  const SC = SCENES[sceneIdx];
  if (retry && cat && words.length){
    words = words.map(w=>({en:w.en,zh:w.zh,slots:[...w.en].map(ch=>({ch,filled:false,reserved:false,el:null})),done:false}));
  } else {
    if (level===1) cat = CATS[0];
    else { const pool = CATS.filter(c=>!usedCats.includes(c.en)); cat = pick(pool.length?pool:CATS); }
    usedCats.push(cat.en); if (usedCats.length>=CATS.length) usedCats=[cat.en];
    const nWords = Math.min(10, 4+level);
    const uniq = [...new Map(cat.w.filter(w=>w[0].length>=3&&w[0].length<=8).map(w=>[w[0],w])).values()];
    words = shuffle(uniq.slice()).slice(0,nWords).map(([en,zh])=>({en,zh,slots:[...en].map(ch=>({ch,filled:false,reserved:false,el:null})),done:false}));
  }
  resetWorld(); letters.forEach(l=>{scene.remove(l.mesh);scene.remove(l.hit);}); letters=[];
  const info = SC.build(); startPos = info.start;
  const needed = words.flatMap(w=>[...w.en]);
  const inWords = new Set(needed);
  const pool = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].filter(c=>!inWords.has(c));
  const nDis = Math.round(needed.length*0.45)+5;
  const dis = Array.from({length:nDis},()=>pick(pool.length?pool:[...'QXZJVKW']));
  spawnLetters(shuffle([...needed,...dis]), startPos);
  const perLetter = Math.max(4.2, 7 - (level-1)*0.35);
  timeLeft = Math.round(needed.length*perLetter + 45);
  levelScore = 0;
  P.x=startPos.x; P.z=startPos.z; P.yaw=startPos.yaw; P.pitch=-0.1;
  buildQuiz();
  $('#lvName').textContent = `第 ${level} 關`;
  $('#scName').textContent = `${SC.emo} ${SC.name}`;
  $('#time').textContent = fmt(timeLeft); $('#timer').classList.remove('low');
  $('#score').textContent = score;
  lastRoom='';
  // intro
  const lens = words.map(w=>w.en.length);
  typeInto($('#introSpeech'), `歡迎來到<b>第 ${level} 關</b>！這一關我們在<b>${SC.emo} ${SC.name}</b>，題目是<b>${cat.emo} ${cat.zh}（${cat.en}）</b>。<br>一共有 <b>${words.length}</b> 個單字，每個單字 ${Math.min(...lens)}～${Math.max(...lens)} 個字母。找到字母方塊撿起來，它會自己飛進空格喔！限時 <b>${fmt(timeLeft)}</b>，加油～`);
  $('#introTags').innerHTML = `<span>${SC.emo} ${SC.name}</span><span>${cat.emo} ${cat.zh}</span><span>📝 ${words.length} 個單字</span><span>🔤 ${needed.length} 個字母</span><span>⏱️ ${fmt(timeLeft)}</span>`;
  show('introOv'); state='intro';
}
function buildQuiz(){
  const q = $('#quiz');
  q.innerHTML = `<h3>${cat.emo} ${cat.zh} <span class="en">${cat.en}</span></h3>` + words.map((w,wi)=>`<div class="w" id="w${wi}"><span class="zh">${w.zh}</span><span class="slots">${w.slots.map((s,si)=>`<i id="s${wi}_${si}"></i>`).join('')}</span></div>`).join('');
  words.forEach((w,wi)=>w.slots.forEach((s,si)=>s.el=$(`#s${wi}_${si}`)));
}
function show(id){ ['titleOv','introOv','pauseOv','clearOv','failOv'].forEach(o=>$('#'+o).classList.toggle('hidden', o!==id)); }
function hideAll(){ show('__none'); }

// ================= INPUT =================
const keys={}; let locked=false, lockFailed=false, dragLook=null, lastTouch=0;
const joy={id:null,sx:0,sy:0,dx:0,dy:0}; const looks=new Map();
function look(dx,dy,k){ P.yaw-=dx*k; P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-dy*k)); }
function requestLock(){ if (isTouch || lockFailed || !canvas.requestPointerLock){ lockFailed=true; return; } try{ const p=canvas.requestPointerLock(); if (p&&p.catch) p.catch(()=>{lockFailed=true;}); }catch(e){ lockFailed=true; } }
document.addEventListener('pointerlockchange',()=>{ locked=document.pointerLockElement===canvas; if (!locked && state==='play' && !lockFailed) pause(); });
document.addEventListener('pointerlockerror',()=>{ lockFailed=true; });
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (state==='play'){ if (k==='e') grab(); if (k==='h') hint(); if (k==='tab'||(k==='escape'&&!locked)){ e.preventDefault(); pause(); } }
  else if (state==='pause' && (k==='tab'||k==='enter')){ e.preventDefault(); resume(); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('mousedown',e=>{ if (state!=='play'||performance.now()-lastTouch<800) return; if (locked){ grab(); return; } if (!lockFailed) requestLock(); dragLook={x:e.clientX,y:e.clientY,moved:0}; });
addEventListener('mousemove',e=>{ if (state!=='play'||performance.now()-lastTouch<800) return; if (locked) look(e.movementX,e.movementY,0.0022); else if (dragLook&&(e.buttons&1)){ const dx=e.clientX-dragLook.x, dy=e.clientY-dragLook.y; dragLook.x=e.clientX; dragLook.y=e.clientY; dragLook.moved+=Math.abs(dx)+Math.abs(dy); look(dx,dy,0.004);} });
addEventListener('mouseup',()=>{ if (dragLook && dragLook.moved<6 && !locked && state==='play') grab(); dragLook=null; });
if (isTouch || ('ontouchstart' in window && navigator.maxTouchPoints>0 && innerWidth<1000)){ $('#joy').style.display='block'; $('#grab').style.display='block'; }
canvas.addEventListener('pointerdown',e=>{
  if (e.pointerType==='mouse') return; lastTouch=performance.now(); if (state!=='play') return;
  const leftZone = e.clientX<innerWidth*0.45 && e.clientY>innerHeight*0.45;
  if (leftZone && joy.id===null){ joy.id=e.pointerId; joy.sx=e.clientX; joy.sy=e.clientY; joy.dx=joy.dy=0; const j=$('#joy'); j.style.left=(e.clientX-60)+'px'; j.style.top=(e.clientY-60)+'px'; j.style.bottom='auto'; }
  else looks.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:0,t:performance.now()});
  try{ canvas.setPointerCapture(e.pointerId);}catch(_){}
});
canvas.addEventListener('pointermove',e=>{
  if (e.pointerType==='mouse') return;
  if (e.pointerId===joy.id){ let dx=e.clientX-joy.sx, dy=e.clientY-joy.sy; const l=Math.hypot(dx,dy), m=50; if (l>m){dx*=m/l;dy*=m/l;} joy.dx=dx/m; joy.dy=dy/m; $('#knob').style.transform=`translate(${dx}px,${dy}px)`; }
  const L=looks.get(e.pointerId); if (L){ const dx=e.clientX-L.x, dy=e.clientY-L.y; L.x=e.clientX; L.y=e.clientY; L.moved+=Math.abs(dx)+Math.abs(dy); look(dx,dy,0.006); }
});
function endTouch(e){ if (e.pointerType==='mouse') return; lastTouch=performance.now();
  if (e.pointerId===joy.id){ joy.id=null; joy.dx=joy.dy=0; $('#knob').style.transform=''; const j=$('#joy'); j.style.left='24px'; j.style.top=''; j.style.bottom=''; }
  const L=looks.get(e.pointerId); if (L){ if (L.moved<8 && performance.now()-L.t<300) grab(); looks.delete(e.pointerId); } }
canvas.addEventListener('pointerup',endTouch); canvas.addEventListener('pointercancel',endTouch);
$('#grab').addEventListener('click',()=>grab());
$('#keys').innerHTML = isTouch
  ? `<kbd>左下搖桿</kbd><span>移動</span><kbd>右側滑動</kbd><span>轉動視角</span><kbd>撿起</kbd><span>準心對準字母方塊後點「撿起」或輕點畫面</span>`
  : `<kbd>W A S D</kbd><span>移動（Shift 奔跑）</span><kbd>滑鼠</kbd><span>轉動視角</span><kbd>點擊 / E</kbd><span>撿起準心對準的字母</span><kbd>H</kbd><span>提示（扣 15 秒）</span><kbd>Tab / Esc</kbd><span>暫停</span>`;

// ================= FLOW =================
function refreshBest(){ const b=loadBest(); $('#bestTxt').textContent = b.level? `最佳紀錄：第 ${b.level} 關・${b.score} 分` : ''; }
refreshBest();
$('#startBtn').onclick = ()=>{ level=1; score=0; usedCats=[]; setupLevel(); };
$('#goBtn').onclick = ()=>{ hideAll(); state='play'; requestLock(); angelSay(`找出 ${cat.zh} 的英文單字！`); };
$('#pauseBtn').onclick = e=>{ e.stopPropagation(); pause(); };
$('#hintBtn').onclick = e=>{ e.stopPropagation(); hint(); };
$('#resumeBtn').onclick = resume;
$('#quitBtn').onclick = ()=>{ saveBest(); refreshBest(); show('titleOv'); state='title'; };
$('#toTitle').onclick = ()=>{ refreshBest(); show('titleOv'); state='title'; };
$('#retryBtn').onclick = ()=>{ score = Math.max(0, score-levelScore); setupLevel(true); };
$('#nextBtn').onclick = ()=>{ level++; setupLevel(); };
function pause(){ if (state!=='play') return; state='pause'; if (locked) document.exitPointerLock();
  $('#pauseList').innerHTML = words.map(w=>`<span class="${w.done?'ok':''}"><span class="en">${w.slots.map(s=>s.filled?s.ch:'_').join(' ')}</span>${w.zh}</span>`).join('');
  show('pauseOv'); }
function resume(){ hideAll(); state='play'; requestLock(); }

function neededSet(){ const s=new Set(); words.forEach(w=>w.slots.forEach(sl=>{ if (!sl.filled && !sl.reserved) s.add(sl.ch); })); return s; }
function reserveSlot(ch){
  for (const w of words) for (const sl of w.slots) if (!sl.filled && !sl.reserved && sl.ch===ch){ sl.reserved=true; return {w,sl}; }
  return null;
}
let target=null;
const ray=new THREE.Raycaster(); ray.far=3.2; const center=new THREE.Vector2(0,0);
function updateTarget(){
  ray.setFromCamera(center,camera);
  const hits = ray.intersectObjects([...occ, ...letters.filter(l=>l.alive).map(l=>l.hit)], false);
  let t=null;
  if (hits.length){ const lh=hits.find(h=>h.object.userData.L); const solid=hits.find(h=>!h.object.userData.L); if (lh && (!solid || lh.distance <= solid.distance+0.3)) t=lh.object.userData.L; }
  target=t; $('#cross').classList.toggle('hot',!!t);
  const pr=$('#prompt'); if (t){ pr.style.display='block'; pr.innerHTML=`字母<b>${t.ch}</b>${isTouch?'點撿起':'點擊或按 E'}`; } else pr.style.display='none';
  $('#grab').disabled=!t;
}
const tmpV = new THREE.Vector3();
function grab(){
  if (state!=='play' || !target) return;
  const L=target; L.alive=false; target=null;
  tmpV.copy(L.mesh.position).project(camera);
  const sx=(tmpV.x*0.5+0.5)*innerWidth, sy=(-tmpV.y*0.5+0.5)*innerHeight;
  scene.remove(L.mesh); scene.remove(L.hit);
  const res = reserveSlot(L.ch);
  const el=document.createElement('div'); el.className='fly'; el.textContent=L.ch; el.style.background=L.mesh.material.map.image.getContext('2d').getImageData(20,20,1,1).data.slice(0,3).reduce((s,v,i)=>s+(i?',':'rgb(')+v,'')+')';
  el.style.transform=`translate(${sx}px,${sy}px)`; document.body.appendChild(el);
  let tx, ty;
  if (res){ const r=res.sl.el.getBoundingClientRect(); tx=r.left+r.width/2; ty=r.top+r.height/2; }
  else { const r=$('#quiz').getBoundingClientRect(); tx=r.left+r.width*0.6; ty=r.top+18; }
  const end=`translate(${tx}px,${ty}px)`; el.style.setProperty('--end',end);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transform = end + (res?' scale(.55)':' scale(.7)'); }));
  chime(res?'good':'bad');
  setTimeout(()=>{
    if (res){ el.remove(); fillSlot(res.w,res.sl); }
    else { el.classList.add('poof'); setTimeout(()=>el.remove(),380); if (Math.random()<0.35) angelSay(`${L.ch} 這一關用不到喔～`,1800); }
  }, 760);
}
function fillSlot(w,sl){
  sl.filled=true; sl.el.textContent=sl.ch; sl.el.classList.add('on','pop'); setTimeout(()=>sl.el.classList.remove('pop'),460);
  score+=10; levelScore+=10;
  if (!w.done && w.slots.every(s=>s.filled)){ w.done=true; score+=50; levelScore+=50; const i=words.indexOf(w); $('#w'+i).classList.add('done'); chime('word'); angelSay(`太棒了！拼出 <b class="en">${w.en}</b>（${w.zh}）🎉`,2600); }
  $('#score').textContent=score;
  if (state==='play' && words.every(w=>w.done)) setTimeout(levelClear, 700);
}
function levelClear(){
  if (state!=='play') return;
  state='clear'; if (locked) document.exitPointerLock();
  const bonus=Math.ceil(timeLeft)*5; score+=bonus; levelScore+=bonus; $('#score').textContent=score; saveBest();
  typeInto($('#clearSpeech'), `哇～你好厲害！<b>第 ${level} 關</b>完成了！<br>${cat.zh}的單字全部拼出來，剩下的時間也變成獎勵分數喔。下一關會在<b>${SCENES[level%SCENES.length].emo} ${SCENES[level%SCENES.length].name}</b>，單字會更多，準備好了嗎？`);
  $('#clearStats').innerHTML = `<div>剩餘時間<b>${fmt(timeLeft)}</b></div><div>時間獎勵<b>+${bonus}</b></div><div>總分<b>${score}</b></div>`;
  $('#clearWords').innerHTML = words.map(w=>`<span class="ok"><span class="en">${w.en}</span>${w.zh}</span>`).join('');
  show('clearOv'); chime('clear');
}
function levelFail(){
  state='fail'; if (locked) document.exitPointerLock(); saveBest();
  const done=words.filter(w=>w.done).length;
  typeInto($('#failSpeech'), `時間到了……這次拼出了 <b>${done}</b> / ${words.length} 個單字。<br>沒關係，看看答案，再挑戰一次一定可以！`);
  $('#failWords').innerHTML = words.map(w=>`<span class="${w.done?'ok':''}"><span class="en">${w.en}</span>${w.zh}</span>`).join('');
  show('failOv');
}
let beams=[];
function hint(){
  if (state!=='play') return;
  const need=neededSet(); const cands=letters.filter(l=>l.alive && need.has(l.ch));
  if (!cands.length){ angelSay('需要的字母都已經在路上了！',1800); return; }
  const near=cands.reduce((a,b)=>Math.hypot(a.mesh.position.x-P.x,a.mesh.position.z-P.z)<Math.hypot(b.mesh.position.x-P.x,b.mesh.position.z-P.z)?a:b);
  timeLeft=Math.max(1,timeLeft-15);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,8,12,1,true), new THREE.MeshBasicMaterial({color:'#fff3a0',transparent:true,opacity:0.55,side:THREE.DoubleSide}));
  beam.position.set(near.mesh.position.x, near.base+4, near.mesh.position.z); scene.add(beam); beams.push({m:beam,t:10});
  angelSay(`往<b>金色光柱</b>那邊找找看，有你需要的字母 <b class="en">${near.ch}</b>！`,3200);
}

// ================= AUDIO =================
let actx=null;
function chime(kind){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume();
    const seq = {good:[660,880],bad:[300,220],word:[523,659,784,1047],clear:[523,659,784,1047,1319]}[kind];
    seq.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*0.08; o.type=kind==='bad'?'sine':'triangle'; o.frequency.value=f; g.gain.setValueAtTime(kind==='bad'?0.06:0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.32); });
  }catch(e){}
}

// ================= LOOP =================
function collides(x,z){ return collidesAt(x,z,P.r); }
function tryMove(dx,dz){ if (!collides(P.x+dx,P.z)) P.x+=dx; if (!collides(P.x,P.z+dz)) P.z+=dz; }
let lastRoom='', roomT=0;
function roomAt(x,z){ const r=ROOMS_NOW.find(({r:[a,b,c,d]})=>x>=a&&x<c&&z>=b&&z<d); return r?r.name:''; }
let last=performance.now(), clock=0, warned=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; clock+=dt;
  if (state==='play'){
    timeLeft-=dt;
    $('#time').textContent=fmt(timeLeft);
    $('#timer').classList.toggle('low', timeLeft<20);
    if (timeLeft<30 && !warned){ warned=true; angelSay('剩下 30 秒，快一點！⏰',2400); }
    if (timeLeft>=30) warned=false;
    if (timeLeft<=0){ timeLeft=0; levelFail(); }
    let f=0,s=0;
    if (keys['w']||keys['arrowup']) f+=1; if (keys['s']||keys['arrowdown']) f-=1; if (keys['d']||keys['arrowright']) s+=1; if (keys['a']||keys['arrowleft']) s-=1;
    if (joy.id!==null){ f-=joy.dy; s+=joy.dx; }
    const len=Math.hypot(f,s);
    if (len>0.05){ const sp=(keys['shift']?4.4:2.7)*Math.min(1,len)/Math.max(1,len); const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw), rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw); tryMove((fx*f+rx*s)*sp*dt,(fz*f+rz*s)*sp*dt); }
    const rn=roomAt(P.x,P.z); if (rn && rn!==lastRoom){ lastRoom=rn; const el=$('#room'); el.textContent=rn; el.classList.add('show'); clearTimeout(roomT); roomT=setTimeout(()=>el.classList.remove('show'),1600); }
  }
  camera.position.set(P.x,1.6,P.z); camera.rotation.set(P.pitch,P.yaw,0);
  for (const l of letters) if (l.alive){ l.mesh.rotation.y+=dt*0.8; l.mesh.position.y=l.base+Math.sin(clock*2+l.ph)*0.04; l.hit.position.y=l.mesh.position.y; }
  for (let i=beams.length-1;i>=0;i--){ const b=beams[i]; b.t-=dt; b.m.material.opacity=0.35+0.2*Math.sin(clock*6); if (b.t<=0){ scene.remove(b.m); b.m.geometry.dispose(); b.m.material.dispose(); beams.splice(i,1);} }
  if (state==='play') updateTarget();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
// title background scene
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('700 80px Fredoka'), new Promise(r=>setTimeout(r,1500))]) : Promise.resolve()).then(()=>{
  const info=buildPark(); P.x=info.start.x; P.z=info.start.z; P.yaw=0.3;
});
requestAnimationFrame(frame);
})();
</script>
</body>
